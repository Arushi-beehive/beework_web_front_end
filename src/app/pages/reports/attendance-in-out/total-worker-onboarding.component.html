<div class="card p-6">
    <!-- Header Row: Stock In + Buttons -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <span class="block text-surface-900 font-bold text-2xl">Worker In-Out Report</span>

        <!-- Buttons - Hidden on mobile, shown in header on desktop -->
        <div class="hidden md:flex gap-4">
            <button pButton type="submit" label="Display" class="p-button-warning" (click)="display()" [disabled]="reportForm.invalid"></button>
            <button pButton type="button" label="Download" icon="pi pi-download" iconPos="right" class="p-button-warning" (click)="downloadExcel()"></button>
            <button pButton type="button" label="Reset" class="p-button-secondary" (click)="reset()"></button>
        </div>
    </div>

    <form [formGroup]="reportForm" class="space-y-8">
        <!-- 🏷 Product Info Section -->
        <div class="space-y-6">
            <!-- Report Type - Full width -->
         <div class="grid grid-cols-1 md:grid-cols-4 gap-6 w-full">

    <!-- Period -->
    <div class="flex flex-col">
        <label class="font-medium mb-1">Period <span class="text-red-500">*</span></label>
        <p-dropdown
            [options]="periodOptions"
            optionLabel="period_name"
            optionValue="period_name"
            [filter]="true"
            [showClear]="true"
            filterPlaceholder="Search Period"
            formControlName="period"
            placeholder="Select Period"
            class="w-full"
        ></p-dropdown>
        <small class="text-red-500 mt-1"
            *ngIf="reportForm.get('period')?.touched && reportForm.get('period')?.invalid">
            Period is required
        </small>
    </div>

   <!-- Project Name -->
                <div class="flex flex-col">
                    <label class="font-medium mb-1">Site <span class="text-red-500">*</span></label>
                    <p-dropdown
                        [options]="projectNameOptions"
                        optionLabel="project_name"
                        optionValue="project_id"
                        [filter]="true"
                        [showClear]="true"
                        (onChange)="onProjectChange($event)"
                        filterPlaceholder="Search Site"
                        formControlName="projectName"
                        placeholder="Site"
                        class="w-full"
                    >
                    </p-dropdown>
                    <small class="text-red-500 mt-1" *ngIf="reportForm.get('projectName')?.touched && reportForm.get('projectName')?.invalid"> Project Name is required </small>
                </div>

                <!-- Group Leader - Full width on mobile, half on desktop -->
                <div class="flex flex-col">
                    <label class="font-medium mb-1">Group Leader</label>
                    <p-dropdown [options]="groupLeaderOptions" optionLabel="dd_value" optionValue="id" [filter]="true" [showClear]="true" filterPlaceholder="Search Group Leader" formControlName="groupleader" placeholder="Group Leader" class="w-full">
                    </p-dropdown>
                </div>

</div>
        </div>

        <!-- Action Buttons - Visible only on mobile, below form fields -->
        <div class="flex md:hidden justify-center gap-2 mt-6">
            <button pButton type="submit" label="Display" class="p-button-warning" (click)="display()" [disabled]="reportForm.invalid"></button>
            <button pButton type="button" label="Download" class="p-button-warning flex-1" (click)="downloadExcel()"></button>
            <button pButton type="button" label="Reset" class="p-button-secondary flex-1" (click)="reset()"></button>
        </div>

        <!-- Product Table with Pagination -->
        <div>
            <p-table
                [value]="recordReport"
                [columns]="columns"
                dataKey="paidamount"
                [tableStyle]="{ 'min-width': '50rem' }"
                [paginator]="true"
                selectionMode="multiple"
                [rows]="10"
                [rowsPerPageOptions]="[10, 20, 50]"
                [responsiveLayout]="'scroll'"
                class="p-datatable-gridlines mt-6 item-report"
            >
                <ng-template #header let-columns>
                    <tr class="bg-yellow-400">
                        <th *ngFor="let col of columns" [style.width]="col.width + 'px'">
                            {{ col.header }}
                        </th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-row let-columns="columns">
                    <tr>
                        <td *ngFor="let col of columns">
                            {{ row[col.field] }}
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="paginatorleft" appendTo="body">
                    <div class="total-items text-gray-600 ms-2">Total Items: {{ recordReport?.length || 0 }}</div>
                </ng-template>
            </p-table>
        </div>
    </form>
</div>
