<div class="card p-6">
    <!-- Header Row: Stock In + Buttons -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <span class="block text-surface-900 font-bold text-2xl">Worker Wages Report</span>

        <!-- Buttons - Hidden on mobile, shown in header on desktop -->
        <div class="hidden md:flex gap-4">
                    <button pButton type="submit" label="Display" class="p-button-warning" (click)="display()"></button>
            <button pButton type="button" label="Download" icon="pi pi-download" iconPos="right" class="p-button-warning" (click)="downloadExcel()"></button>
            <button pButton type="button" label="Reset" class="p-button-secondary" (click)="reset()"></button>
        </div>
    </div>

    <form [formGroup]="reportForm" class="space-y-8">
        <!-- 🏷 Product Info Section -->
        <div class="space-y-6">
            <!-- Report Type - Full width -->
            <div class="grid grid-cols-1 md:grid-cols-5 gap-6 w-full">
                <!-- Start Date -->
                <div class="flex flex-col">
                    <label class="font-medium mb-1">Start Date</label>
                    <p-datepicker fluid formControlName="startDate" dateFormat="dd/mm/yy" [showIcon]="true" placeholder="From Date"></p-datepicker>
                    <small class="text-red-500 ms-3 mt-1" *ngIf="reportForm.get('startDate')?.touched">
                        <span *ngIf="reportForm.get('startDate')?.errors?.['required']">Start Date is required</span>
                    </small>
                </div>

                <!-- End Date -->
                <div class="flex flex-col">
                    <label class="font-medium mb-1">End Date</label>
                    <p-datepicker fluid formControlName="endDate" dateFormat="dd/mm/yy" [showIcon]="true" placeholder="To Date"></p-datepicker>
                    <small class="text-red-500 ms-3 mt-1" *ngIf="reportForm.get('endDate')?.touched">
                        <span *ngIf="reportForm.get('endDate')?.errors?.['required']">To Date is required</span>
                        <span *ngIf="reportForm.errors?.['dateRangeInvalid'] && reportForm.get('endDate')?.touched">To Date must be greater than or equal to From Date</span>
                    </small>
                </div>

                <div class="flex flex-col">
                    <label class="font-medium mb-1">Project</label>
                    <p-dropdown
                        [options]="projectNameOptions"
                        optionLabel="project_name"
                        optionValue="project_id"
                        [filter]="true"
                        [showClear]="true"
                        filterPlaceholder="Select Project Name"
                        formControlName="projectName"
                        placeholder="Project Name"
                        class="w-full"
                    >
                    </p-dropdown>
                </div>

                <!-- Group Leader - Full width on mobile, half on desktop -->
                <div class="flex flex-col">
                    <label class="font-medium mb-1">Group Leader</label>
                    <p-dropdown [options]="groupLeaderOptions" optionLabel="dd_value" optionValue="id" [filter]="true" [showClear]="true" filterPlaceholder="Search Group Leader" formControlName="groupleader" placeholder="Group Leader" class="w-full">
                    </p-dropdown>
                </div>

                 <!-- Supervisor - Full width on mobile, half on desktop -->
                <div class="flex flex-col">
                    <label class="font-medium mb-1">Supervisor</label>
                    <p-dropdown [options]="supervisiorOptions" optionLabel="dd_value" optionValue="id" [filter]="true" [showClear]="true" filterPlaceholder="Search Supervisor" formControlName="supervisior" placeholder="Supervisor" class="w-full">
                    </p-dropdown>
                </div>
            </div>
        </div>

        <!-- Action Buttons - Visible only on mobile, below form fields -->
        <div class="flex md:hidden justify-center gap-2 mt-6">
            <button pButton type="button" label="Download" class="p-button-warning flex-1" (click)="downloadExcel()"></button>
            <button pButton type="button" label="Reset" class="p-button-secondary flex-1" (click)="reset()"></button>
        </div>

        <!-- Product Table with Pagination -->
        <div>
            <p-table
                [value]="recordReport"
                [columns]="columns"
                dataKey="paidamount"
                [tableStyle]="{ 'min-width': '50rem' }"
                [paginator]="true"
                selectionMode="multiple"
                [rows]="10"
                [rowsPerPageOptions]="[10, 20, 50]"
                [responsiveLayout]="'scroll'"
                class="p-datatable-gridlines mt-6 item-report"
            >
                <ng-template #header let-columns>
                    <tr class="bg-yellow-400">
                        <th *ngFor="let col of columns" [style.width]="col.width + 'px'">
                {{ col.header }}
            </th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-row let-columns="columns">
                    <tr>
            <td *ngFor="let col of columns">
                {{ row[col.field] }}
            </td>
        </tr>
                </ng-template>

                <ng-template pTemplate="paginatorleft" appendTo="body">
                    <div class="total-items text-gray-600 ms-2">Total Items: {{ recordReport?.length || 0 }}</div>
                </ng-template>
            </p-table>
        </div>
    </form>
</div>
