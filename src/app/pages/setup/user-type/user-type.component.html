<div class="card p-6">
    <div class="flex justify-between items-center mb-6">
        <span class="block text-surface-900 font-bold text-xl mb-6">User Type</span>

        <div class="flex gap-4">
            <button pButton type="button" label="Add Profile" icon="pi pi-plus" class="p-button-warning" (click)="openUserDialog()"></button>
        </div>
    </div>

    <!-- 🔍 Compact Global Search Section -->
    <div class="mb-3 w-full" *ngIf="showGlobalSearch">
        <app-global-filter [(value)]="globalFilter" placeholder="Profile Name i.e. Admin" (valueChange)="applyGlobalFilterManual()"></app-global-filter>
    </div>

    <!-- 📋 User Table -->
    <p-table [value]="filteredUser" dataKey="id" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[ 10, 20]" [responsiveLayout]="'scroll'" class="p-datatable-gridlines mt-6">
        <ng-template pTemplate="header">
            <tr>
                <th>Profile Name</th>
                <th>Active</th>
                <th>Web Access</th>
                <th class="text-center">Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user let-rowIndex="rowIndex">
            <tr>
                <td>{{ user.profilename }}</td>
                <td>{{ user.isactive }}</td>
                <td>{{ user.web_access }}</td>
               <td>
    <div class="flex gap-2">
        <i
            class="pi pi-pencil cursor-pointer text-blue-500"
            (click)="openEditDialog(user)">
        </i>
        <i *ngIf="user.noneditable !== 'Y'"
         class="pi pi-trash cursor-pointer text-red-500" (click)="deleteRow(user)"></i>
    </div>
</td>

            </tr>
        </ng-template>
        <ng-template pTemplate="paginatorleft">
            <div class="text-gray-600 ms-2">Total User Types: {{ filteredUser?.length || 0 }}</div>
        </ng-template>
    </p-table>

    <!-- ✳️ Add/Edit User Dialog -->
    <p-dialog header="{{ editMode ? 'Edit Profile' : 'Add Profile' }}" [(visible)]="visibleDialog" [modal]="true" [style]="{ width: '25vw' }" [draggable]="false" [resizable]="false">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="grid grid-cols-2 gap-x-6 gap-y-4">
                <!-- Profile Name -->
                <div class="flex flex-col">
                    <label class="font-medium mb-1">Profile Name <span class="text-red-500">*</span></label>
                    <input pInputText formControlName="p_pname" placeholder="Profile Name" />
                    <small class="text-red-500 mt-1" *ngIf="profileForm.get('p_pname')?.touched && profileForm.get('p_pname')?.invalid"> Profile Name is required </small>
                </div>
              
                <div class= "flex gap-3">
                <!-- Active -->
                <div class="flex gap-3 mt-9">
                    <p-checkbox formControlName="checked" [binary]="true"></p-checkbox>
                    <label class="font-medium">Active</label>
                </div>

                <!-- Web Access -->
                <div class="flex gap-3 mt-9">
                    <p-checkbox formControlName="webaccess" [binary]="true"></p-checkbox>
                    <label class="font-medium">Web Access</label>
                </div>
                </div>
            </div>

            <div class="flex justify-end gap-4 mt-6">
                <button pButton type="button" label="Cancel" class="p-button-secondary" (click)="closeDialog()"></button>
                <button pButton type="submit" label="Submit" class="p-button-warning" [disabled]="profileForm.invalid"></button>
            </div>
        </form>
    </p-dialog>

    <p-confirmDialog></p-confirmDialog>
</div>
